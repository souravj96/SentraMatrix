name: Build SentraMatrix

on:
  push:
    branches:
      - main
      - develop
      - "10-esp32-support"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------
  # JOB: Determine version and whether to release
  # ----------------------------------------------------------------
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      is_release: ${{ steps.bump.outputs.is_release }}
      release_tag: ${{ steps.bump.outputs.release_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: bump
        shell: bash
        run: |
          IS_RELEASE="false"
          NEW_TAG=""
          RELEASE_TAG=""

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Manual tag push — use the pushed tag as-is
            IS_RELEASE="true"
            RELEASE_TAG="${GITHUB_REF_NAME}"
            NEW_TAG="${GITHUB_REF_NAME}"

          elif [[ "${GITHUB_REF_NAME}" == "main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # Auto-bump on main push
            LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
            if [[ -z "${LATEST_TAG}" ]]; then
              LATEST_TAG="v1.0.0"
            fi

            # Get commit messages since last tag
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || echo "chore: update")

            VERSION="${LATEST_TAG#v}"
            IFS="." read -r MAJOR MINOR PATCH <<< "$VERSION"

            if echo "$COMMITS" | grep -iqE "BREAKING CHANGE|breaking:|major:"; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif echo "$COMMITS" | grep -iqE "^feat"; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

            # Only release if there are actual commits since last tag
            COMMIT_COUNT=$(git log "${LATEST_TAG}..HEAD" --oneline 2>/dev/null | wc -l | tr -d ' ')
            if [[ "$COMMIT_COUNT" -gt 0 ]]; then
              IS_RELEASE="true"
              RELEASE_TAG="${NEW_TAG}"
            fi
          fi

          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "==> is_release=${IS_RELEASE}  new_tag=${NEW_TAG}  release_tag=${RELEASE_TAG}"

  # ----------------------------------------------------------------
  # JOB: Build firmware for both ESP8266 and ESP32
  # ----------------------------------------------------------------
  build:
    name: Build (${{ matrix.chip }})
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        include:
          - env: nodemcuv2
            chip: esp8266
          - env: esp32dev
            chip: esp32

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio intelhex

      - name: Build firmware (${{ matrix.chip }})
        run: pio run -e ${{ matrix.env }}

      - name: Prepare firmware binary
        id: prep
        shell: bash
        run: |
          mkdir -p release
          SHORT_SHA="${GITHUB_SHA::7}"
          IS_RELEASE="${{ needs.version.outputs.is_release }}"
          RELEASE_TAG="${{ needs.version.outputs.release_tag }}"
          CHIP="${{ matrix.chip }}"

          if [[ "${IS_RELEASE}" == "true" && -n "${RELEASE_TAG}" ]]; then
            BIN_NAME="SentraMatrix-${RELEASE_TAG}-${CHIP}.bin"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            BIN_NAME="SentraMatrix-pr${PR_NUM}-${SHORT_SHA}-${CHIP}.bin"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            BIN_NAME="SentraMatrix-develop-${SHORT_SHA}-${CHIP}.bin"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            BIN_NAME="SentraMatrix-main-${SHORT_SHA}-${CHIP}.bin"
          else
            SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
            BIN_NAME="SentraMatrix-${SAFE_REF}-${SHORT_SHA}-${CHIP}.bin"
          fi

          ARTIFACT_NAME="SentraMatrix-firmware-${CHIP}"

          cp .pio/build/${{ matrix.env }}/firmware.bin "release/${BIN_NAME}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "bin_name=${BIN_NAME}" >> "$GITHUB_OUTPUT"
          echo "==> Prepared ${BIN_NAME} under artifact ${ARTIFACT_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.artifact_name }}
          path: release/${{ steps.prep.outputs.bin_name }}
          if-no-files-found: error

  # ----------------------------------------------------------------
  # JOB: Tag and Release (main push only, or manual tag push)
  # ----------------------------------------------------------------
  release:
    name: Create Tag & Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: needs.version.outputs.is_release == 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: github.ref_type != 'tag'
        run: |
          TAG="${{ needs.version.outputs.release_tag }}"
          git tag "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Created and pushed tag ${TAG}"

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SentraMatrix-firmware-*
          path: release/
          merge-multiple: true

      - name: List downloaded release binaries
        run: ls -la release/

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          LATEST_TAG="${{ needs.version.outputs.release_tag }}"
          PREV_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | grep -v "^${LATEST_TAG}$" | head -n 1)

          if [[ -z "$PREV_TAG" ]]; then
            BODY="Initial release of SentraMatrix firmware."
          else
            BODY="## What's Changed"$'\n'
            while IFS= read -r line; do
              BODY+="- ${line}"$'\n'
            done < <(git log "${PREV_TAG}..HEAD" --pretty=format:"%s (%h)" 2>/dev/null)
            BODY+=$'\n'"**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${LATEST_TAG}"
          fi

          echo "RELEASE_NOTES<<ENDOFNOTES" >> "$GITHUB_ENV"
          echo "$BODY" >> "$GITHUB_ENV"
          echo "ENDOFNOTES" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: SentraMatrix ${{ needs.version.outputs.release_tag }}
          body: ${{ env.RELEASE_NOTES }}
          files: release/*.bin
