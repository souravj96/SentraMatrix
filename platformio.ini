[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps = 
	majicdesigns/MD_Parola@^3.7.5
	majicdesigns/MD_MAX72XX@^3.5.1
	wnatth3/WiFiManager@^2.0.16-rc.2
	knolleary/PubSubClient@^2.8
